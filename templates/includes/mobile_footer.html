<!-- templates/includes/mobile_footer.html -->
<div class="mobile-footer d-lg-none fixed-bottom bg-white border-top shadow-sm">
    <div class="container">
        <div class="row g-0">
            <div class="col">
                <a href="{% url 'home' %}" class="btn btn-footer d-flex flex-column align-items-center py-2">
                    <i class="fas fa-home fa-lg mb-1"></i>
                    <span class="small">Главная</span>
                </a>
            </div>
            <div class="col">
                <a href="{% url 'all_products' %}" class="btn btn-footer d-flex flex-column align-items-center py-2">
                    <i class="fas fa-search fa-lg mb-1"></i>
                    <span class="small">Поиск</span>
                </a>
            </div>
            <div class="col">
                <a href="{% url 'cart_detail' %}" class="btn btn-footer d-flex flex-column align-items-center py-2 position-relative">
                    <i class="fas fa-shopping-cart fa-lg mb-1"></i>
                    <span class="small">Корзина</span>
                    {% if cart_items_count %}
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" 
                          style="font-size: 0.6rem;">
                        {{ cart_items_count }}
                    </span>
                    {% endif %}
                </a>
            </div>
            <div class="col">
                <a href="{% url 'profile' %}" class="btn btn-footer d-flex flex-column align-items-center py-2">
                    {% if user.is_authenticated %}
                    <i class="fas fa-user fa-lg mb-1"></i>
                    <span class="small">Профиль</span>
                    {% else %}
                    <i class="fas fa-sign-in-alt fa-lg mb-1"></i>
                    <span class="small">Войти</span>
                    {% endif %}
                </a>
            </div>
            <div class="col">
                <button class="btn btn-footer d-flex flex-column align-items-center py-2 w-100" 
                        type="button" 
                        data-bs-toggle="offcanvas" 
                        data-bs-target="#mobileNav">
                    <i class="fas fa-bars fa-lg mb-1"></i>
                    <span class="small">Меню</span>
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.btn-footer {
    color: #6c757d;
    text-decoration: none;
    width: 100%;
    border: none;
    background: none;
}
.btn-footer:hover, .btn-footer.active {
    color: #6f42c1;
}
.btn-footer:focus {
    box-shadow: none;
}
.mobile-footer {
    z-index: 1020;
}
</style>
